spring.application.name=job-application-tracker

# ---- Postgres ----
# Reads from env vars if set (that's how you'd run this in Docker/prod), otherwise
# falls back to these local defaults so `mvn spring-boot:run` still just works
# against a local Postgres started via docker-compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/atsdb}
spring.datasource.username=${DB_USERNAME:atsuser}
spring.datasource.password=${DB_PASSWORD:atspassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
# update is fine for a project at this stage - swap for a Flyway/Liquibase migration
# setup (ddl-auto=validate) once the schema stabilizes and you care about safe prod migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
# IMPORTANT: change this secret before deploying anywhere real, and don't commit
# a real one to git - pull it from an env var in production.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-value-before-deploying-1234567890}
app.jwt.expiration-ms=86400000

# ---- File uploads (resumes) ----
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=${PORT:8080}
